<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Luke Raczynski: accountant and software developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.6" stop-color="#0f2a3a"/><stop offset="1" stop-color="#0d4f4a"/></linearGradient>
<pattern id="rule" width="1280" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H1280" stroke="#5eead4" stroke-opacity="0.09"/></pattern>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-32px)}}
.rules{animation:drift 6s linear infinite}
</style>
</defs>
<rect width="1280" height="320" fill="url(#bg)"/>
<g class="rules"><rect y="0" width="1280" height="400" fill="url(#rule)"/></g>
<text x="96" y="92" class="mono" font-size="22" fill="#5eead4" fill-opacity="0.85">&lt;/&gt;  +  £</text>
<text x="92" y="176" class="sans" font-size="80" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Luke Raczynski</text>
<text x="96" y="226" class="sans" font-size="30" fill="#cbd5e1">Accountant who ships software.</text>
<text x="96" y="268" class="mono" font-size="19" fill="#5eead4" fill-opacity="0.9">internal tooling · automation · Python</text>
<g transform="translate(1040 70)" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="2">
<rect width="150" height="180" rx="10"/><path d="M24 44H126M24 78H126M24 112H96"/><path d="M24 146H70" stroke-opacity="0.7"/>
</g>
</svg>
